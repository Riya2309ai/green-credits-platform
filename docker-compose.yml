services:
  mysql:
    image: mysql:8.4
    container_name: gc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ledger_db
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledgerpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  kafka:
    image: apache/kafka:3.9.0
    container_name: gc-kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  mongo:
    image: mongo:7.0
    container_name: gc-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  kafka_data:
  mongo_data: