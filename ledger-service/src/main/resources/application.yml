server:
  port: 8081
  error:
    include-message: always
    include-stacktrace: always
spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:mysql://localhost:3307/ledger_db?sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ledger
    password: ledgerpass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 5000
ledger:
  issuer-owner-id: green-issuer
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka