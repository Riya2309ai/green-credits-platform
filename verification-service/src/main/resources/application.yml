server:
  port: 8083
spring:
  application:
    name: verification-service
  mongodb:
    uri: mongodb://localhost:27017/verification_db
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: verification-service
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 5000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
